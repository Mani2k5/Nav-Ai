<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="window" x1="140" y1="150" x2="372" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Train Front Silhouette -->
  <rect x="120" y="110" width="272" height="280" rx="42" fill="#ffffff"/>
  <!-- Windshield -->
  <rect x="146" y="140" width="220" height="96" rx="16" fill="url(#window)"/>
  <line x1="256" y1="140" x2="256" y2="236" stroke="#ffffff" stroke-width="6"/>
  <!-- Headlights -->
  <circle cx="175" cy="320" r="22" fill="#fef08a"/>
  <circle cx="337" cy="320" r="22" fill="#fef08a"/>
  <circle cx="175" cy="320" r="14" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="337" cy="320" r="14" fill="#ffffff" fill-opacity="0.8"/>
  <!-- Center Signal / Indicator -->
  <rect x="232" y="270" width="48" height="20" rx="8" fill="#3b82f6"/>
  <!-- Cowcatcher / Track Guard -->
  <path d="M140 400 L372 400 L350 430 L162 430 Z" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Rails -->
  <line x1="150" y1="440" x2="130" y2="475" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
  <line x1="362" y1="440" x2="382" y2="475" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="465" x2="392" y2="465" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
</svg>